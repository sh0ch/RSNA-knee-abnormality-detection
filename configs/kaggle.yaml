# Kaggle kernel overrides — mount competition data automatically
# Internet must be OFF for submission.

seed: 42

data:
  root: null  # resolved by default_data_root() on Kaggle
  num_workers: 4
  volume_shape: [16, 256, 256]
  max_series: 3

model:
  name: convnext_tiny_mil
  num_labels: 12
  use_report_text: false
  # Phase 1: from-scratch to validate the submit pipeline (n=58 → weak score expected).
  allow_random_init: true

training:
  # Per GPU. T4 x2 → global batch 8. Drop to 2 if you OOM on a single GPU.
  batch_size: 4
  learning_rate: 1.0e-4
  max_epochs: 8
  val_fold: 0
  n_folds: 5
  mixup_alpha: 0.4
  amp: true

inference:
  tta: true

paths:
  output_dir: /kaggle/working/outputs
  checkpoint_dir: /kaggle/working/checkpoints
