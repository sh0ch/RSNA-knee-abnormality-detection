# Kaggle kernel overrides — mount competition data automatically

seed: 42

data:
  root: /kaggle/input/rsna-knee-abnormality-detection
  num_workers: 2
  volume_shape: [48, 384, 384]

model:
  name: baseline
  num_labels: 12
  use_report_text: true

training:
  batch_size: 4
  learning_rate: 1.0e-4
  max_epochs: 10
  val_fold: 0
  n_folds: 5

inference:
  tta: true

paths:
  output_dir: /kaggle/working/outputs
  checkpoint_dir: /kaggle/working/checkpoints
