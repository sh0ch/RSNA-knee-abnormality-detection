# Default configuration for local prototyping
# Override per-experiment in configs/experiments/ or via CLI

seed: 42

data:
  root: null  # null = auto-detect (sample locally, /kaggle/input on Kaggle)
  num_workers: 0
  volume_shape: [16, 256, 256]  # D, H, W after resample (per series)
  max_series: 3

model:
  name: convnext_tiny_mil
  num_labels: 12
  use_report_text: false
  # Phase 1 pipeline smoke: train from scratch (no ImageNet Dataset needed).
  allow_random_init: true

training:
  batch_size: 2  # per GPU; DataParallel multiplies by n_gpus
  learning_rate: 1.0e-4
  max_epochs: 1  # smoke; use configs/kaggle.yaml for real runs
  val_fold: 0
  n_folds: 5
  mixup_alpha: 0.4
  amp: true

inference:
  tta: false

paths:
  output_dir: outputs
  checkpoint_dir: checkpoints
